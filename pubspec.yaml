name: puck
description: >-
  One floating button. Four gestures. Zero menus.
  A minimalist context surface for people who hate apps.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ^3.5.0

# ---------------------------------------------------------------------------
# Dependency budget
# ---------------------------------------------------------------------------
# Puck is deliberately thin. Every dependency below is either (a) pure Dart
# with no native payload, or (b) a thin plugin over a platform API we cannot
# reach from Dart.
#
#   flutter_riverpod    pure Dart        state / DI
#   http                pure Dart        Groq + Open-Meteo
#   shared_preferences  plugin (tiny)    settings
#   flutter_secure_storage  plugin       API key -> Keychain / Keystore
#   battery_plus        plugin (tiny)    battery level
#   device_calendar     plugin (tiny)    next event
#   geolocator          plugin (tiny)    GPS for SOS + weather
#   torch_light         plugin (tiny)    flashlight (binary on/off only)
#   vibration           plugin (tiny)    long SOS patterns
#   url_launcher        plugin (tiny)    pre-filled SMS
#   speech_to_text      plugin (HEAVY)   <-- the only big one, see README
#
#
# REVERSAL (2026-10): the original budget banned intl and flutter_localizations
# to keep the app thin and English-only. That decision is now wrong. Puck is
# for everyone, "everyone" does not read English, and 12-hour AM/PM clock
# strings for 7.5 billion people is not thinness -- it is a defect. Reasoning
# and the full list of what changed is in FINDINGS.md.
#
#   flutter_localizations  sdk          Material/Cupertino delegates, RTL, and
#                                       the locale data intl formats against
#   intl                   pure Dart    DateFormat/NumberFormat: 24-hour clocks,
#                                       locale month and day names, date order
#   package_info_plus      plugin (tiny) the real version string, for
#                                       diagnostics and bug reports
#
# Still banned: font packages (system type only), state-management codegen,
# icon packs (custom painters), analytics, crash reporting.
# ---------------------------------------------------------------------------

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # `any` on purpose: flutter_localizations pins an exact intl version, and a
  # range here is the classic "version solving failed" in a Flutter app.
  intl: any

  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  battery_plus: ^6.2.1
  device_calendar: ^4.3.1
  geolocator: ^13.0.2
  torch_light: ^2.0.0
  vibration: ^1.9.0
  speech_to_text: ^7.0.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/jokes.json
